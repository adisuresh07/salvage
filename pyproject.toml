[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "salvage"
version = "0.1.0"
description = "Deterministic, reason-aware payment recovery prototype"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "typer==0.27.2",
  "Jinja2==3.1.6",
  "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.165.10",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
salvage = "salvage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/salvage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["salvage"]

[dependency-groups]
dev = [
  "hypothesis==6.165.10",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
  "types-PyYAML==6.0.12.20250915",
]
